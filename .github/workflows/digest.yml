name: digest

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 Asia/Makassar (Бали, UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-sniper-repo
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore database
        run: bash scripts/db_pull.sh
      - name: Send digest
        run: python monitor.py digest
        env:
          # Нужен для освежения цен лучшего маршрута перед отправкой; без него
          # run_digest пропускает освежение и шлёт цены до 3 часов давности.
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Persist database
        run: bash scripts/db_push.sh "digest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
