# BSZ — код Бишкека в справочнике Travelpayouts. FRU их API не принимает:
# "unknown location code `FRU`". Проверено живым запросом 02.08.2026.
origins: [BSZ, ALA]
destinations: [HKT, DPS]
markets: [kg, ru]
market_currency:
  kg: kgs
  ru: rub
cross_market_delta: 0.05
fx_markup:
  default: 0.025
  usd: 0.0
# Список месяцев вылета: поддерживается несколько одновременно (добавить
# соседний месяц — одна строка), но сейчас следим только за октябрём.
departure_months: ["2026-10"]
return_months: ["2026-10", "2026-11"]
trip_type: one_way          # ищем билеты только в одну сторону
nights_range: [10, 16]      # не применяется при one_way — оставлено на случай возврата к RT
report_currency: usd
max_transfer_hours: 12
abs_threshold_usd: 250
anomaly_percentile: 10
yellow_delta: 0.15
baseline_window_days: 30
# Насколько должна измениться цена маршрута между сводками (в обе стороны),
# чтобы это считалось новостью и заслуживало полной сводки, а не короткой.
digest_quiet_delta: 0.05
# Скан идёт каждые 30 минут (см. .github/workflows/scan.yml), значит живая цена
# подтверждается четырьмя циклами подряд за 2 часа. Запись, которую перестали
# находить, выпадает из дайджеста и алертов за 2 часа вместо прежних 48 —
# именно такой разрыв между "цена появилась в кэше" и "стала невалидной"
# устроил владельца сюрприз $171 -> $298 (см. отчёт о расследовании).
cache_ttl_hours: 2
digest_time: "09:00"
timezone: "Asia/Bishkek"
