# BSZ — код Бишкека в справочнике Travelpayouts. FRU их API не принимает:
# "unknown location code `FRU`". Проверено живым запросом 02.08.2026.
#
# В режиме поездки маршруты берутся из trip.stops (см. ниже), а эти списки
# пусты. Вернуть мониторинг пары направлений — заполнить их и убрать trip.
origins: []
destinations: []
markets: [kg, ru]
market_currency:
  kg: kgs
  ru: rub
cross_market_delta: 0.05
fx_markup:
  default: 0.025
  usd: 0.0
# Поездка в конце января 2027; последний перелёт может прийтись на февраль.
departure_months: ["2027-01", "2027-02"]
return_months: ["2027-01"]  # не применяется при one_way
trip_type: one_way          # ищем билеты только в одну сторону
nights_range: [10, 16]      # не применяется при one_way — оставлено на случай возврата к RT
report_currency: usd
max_transfer_hours: 12
abs_threshold_usd: 250
# Порог BUY по маршрутам. Общий abs_threshold_usd остаётся фоном для маршрутов,
# которых здесь нет, и им же управляет команда /threshold.
#
# Почему пороги разные: за 02–10.08.2026 ниже $250 не опустился ни один живой
# оффер (единственный дешевле — фантом $171, проживший 3 секунды), то есть
# абсолютная ветка светофора не срабатывала вообще. Значения ниже взяты чуть
# ниже наблюдавшегося живого минимума маршрута, чтобы порог означал "лучше, чем
# было за неделю наблюдений", а не "как обычно":
#   ALA-HKT  живой минимум $272  -> 265
#   ALA-DPS  живой минимум $295  -> 290
#   BSZ-HKT  живой минимум $343  -> 340
#   BSZ-DPS  живой минимум $460, но до 07.08 держался оффер KC за $399 -> 430
route_thresholds_usd:
  ALA-HKT: 265
  ALA-DPS: 290
  BSZ-HKT: 340
  BSZ-DPS: 430
anomaly_percentile: 10
yellow_delta: 0.15
baseline_window_days: 30
# Насколько должна измениться цена маршрута между сводками (в обе стороны),
# чтобы это считалось новостью и заслуживало полной сводки, а не короткой.
digest_quiet_delta: 0.05
# Скан идёт раз в час (первый проход рана, см. .github/workflows/scan.yml).
# Три часа — чтобы один пропущенный планировщиком запуск не выбрасывал живые
# цены из сводки. Короткий TTL по-прежнему важен: разрыв между "цена появилась
# в кэше" и "стала невалидной" устроил владельцу сюрприз $171 -> $298 (см.
# отчёт о расследовании).
cache_ttl_hours: 3
# Сколько минут оффер должен прожить, чтобы система считала его существующим —
# в статистике, в алертах, в сводке и в арбитраже. Скан идёт раз в час,
# так что запись, увиденная хотя бы в двух сканах, порог проходит.
#
# Зачем: 18,4% записей за 02–10.08.2026 прожили меньше 15 минут, то есть
# попались в одном проходе и исчезли. Оба оффера с невозможными ценами ($171 и
# $261 на ALA-HKT) — из их числа, оба прожили по 3 секунды. Один такой фантом
# в выборке превращал недельное падение $280 -> $272 в «на 58% дороже, чем
# неделю назад». Цена ошибки — задержка алерта на один проход.
min_offer_lifetime_minutes: 10
digest_time: "09:00"
timezone: "Asia/Makassar"  # Бали, UTC+8

# Поездка Бали → Пхукет → Вьетнам → Филиппины → Бали.
# Покрытие кэша замерено 22.10.2026 (docs/superpowers/specs/2026-10-22-multi-leg-trip-design.md):
# PPS (Пуэрто-Принсеса) почти пуст, поэтому не включён — добавить одной строкой.
trip:
  stops:
    - [DPS]
    - [HKT]
    - [SGN, HAN, DAD, PQC, CXR]
    - [MNL, CEB, MPH]
    - [DPS]
  earliest_start: "2027-01-15"
  latest_start: "2027-01-22"
  max_total_days: 14
  min_stay_days: 3
  alert_total_usd: 380
  top_n: 3
