# BSZ — код Бишкека в справочнике Travelpayouts. FRU их API не принимает:
# "unknown location code `FRU`". Проверено живым запросом 02.08.2026.
origins: [BSZ, ALA]
destinations: [HKT, DPS]
markets: [kg, ru]
market_currency:
  kg: kgs
  ru: rub
cross_market_delta: 0.05
fx_markup:
  default: 0.025
  usd: 0.0
departure_month: "2026-10"
return_months: ["2026-10", "2026-11"]
trip_type: one_way          # ищем билеты только в одну сторону
nights_range: [10, 16]      # не применяется при one_way — оставлено на случай возврата к RT
report_currency: usd
max_transfer_hours: 12
abs_threshold_usd: 250
anomaly_percentile: 10
yellow_delta: 0.15
baseline_window_days: 30
cache_ttl_hours: 48
digest_time: "09:00"
timezone: "Asia/Bishkek"
